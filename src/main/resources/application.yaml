# ============================================================
# BOOKSTORE BACKEND - APPLICATION CONFIGURATION
# ============================================================

spring:

  # ----------------------------------------------------------
  # APPLICATION
  # ----------------------------------------------------------
  application:
    name: bookstore-backend

  # ----------------------------------------------------------
  # DATABASE - POSTGRESQL
  # ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/bookstore_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------------------------
  # JPA / HIBERNATE
  # ----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  # ----------------------------------------------------------
  # REDIS
  # ----------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # ----------------------------------------------------------
  # RABBITMQ
  # ----------------------------------------------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# ============================================================
# EMAIL / SMTP
# ============================================================

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # ----------------------------------------------------------
  # FILE UPLOAD
  # ----------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB


# ============================================================
# SERVER
# ============================================================

server:
  port: 8082


# ============================================================
# ACTUATOR
# ============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized


# ============================================================
# SPRINGDOC / SWAGGER
# ============================================================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


# ============================================================
# LOGGING
# ============================================================

logging:
  level:
    root: INFO
    com.bookstore: DEBUG

# ============================================================
# S3
# ============================================================

aws:
  region: ${AWS_REGION:ap-south-2}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:bookstore-backend-images-509581811051-ap-south-2-an}

# ============================================================
# JWT
# ============================================================

jwt:
  secret: ${JWT_SECRET:change-this-secret-for-local-development-only}
  expiration: ${JWT_EXPIRATION:86400000}