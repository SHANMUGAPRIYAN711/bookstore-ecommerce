# ============================================================
# BOOKSTORE BACKEND - APPLICATION CONFIGURATION
# ============================================================

spring:

  # ----------------------------------------------------------
  # APPLICATION
  # ----------------------------------------------------------
  application:
    name: bookstore-backend

  # ----------------------------------------------------------
  # DATABASE - POSTGRESQL
  # ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/bookstore_db
    username: postgres
    password: Shanmu@123
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------------------------
  # JPA / HIBERNATE
  # ----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  # ----------------------------------------------------------
  # REDIS
  # ----------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # ----------------------------------------------------------
  # RABBITMQ
  # ----------------------------------------------------------
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ----------------------------------------------------------
  # FILE UPLOAD
  # ----------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB


# ============================================================
# SERVER
# ============================================================

server:
  port: 8080


# ============================================================
# ACTUATOR
# ============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized


# ============================================================
# SPRINGDOC / SWAGGER
# ============================================================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


# ============================================================
# LOGGING
# ============================================================

logging:
  level:
    root: INFO
    com.bookstore: DEBUG